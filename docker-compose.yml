services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: impulso
      POSTGRES_PASSWORD: impulso
      POSTGRES_DB: impulso
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impulso"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://impulso:impulso@db:5432/impulso
      SECRET_KEY: ${SECRET_KEY:-cambiar-en-produccion}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
